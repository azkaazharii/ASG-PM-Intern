<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kelengkapan Dokumen | Inline Date Next to Text</title>
<!-- PDF.js CDN -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
</script>
<style>
:root{--radius:.625rem;--background:oklch(.975 .002 250);--foreground:oklch(.24 .02 260);--brand:oklch(.58 .19 262);--brand-foreground:oklch(.99 0 0);--brand-soft:oklch(.97 .02 262);--danger:oklch(.6 .22 25);--card:oklch(1 0 0);--popover:oklch(1 0 0);--popover-foreground:oklch(.129 .042 264.695);--muted-foreground:oklch(.554 .046 257.417);--border:oklch(.929 .013 255.508);--ring:oklch(.704 .04 256.788)}
*{box-sizing:border-box;border-color:var(--border)}html,body{margin:0;min-height:100%}body{background:var(--background);color:var(--foreground);font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}button,input{font:inherit}button{cursor:pointer}a{color:inherit;text-decoration:none}
.app{display:flex;min-height:100vh;background:var(--background)}.sidebar{display:flex;width:4rem;flex:0 0 4rem;flex-direction:column;align-items:center;gap:1rem;border-right:1px solid var(--border);background:var(--card);padding:1.5rem 0}.side-icon{display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--border);border-radius:9999px;padding:.5rem;color:var(--muted-foreground);background:transparent}.side-icon.active{border-color:color-mix(in oklch,var(--brand) 40%,transparent);background:var(--brand-soft);color:var(--brand)}
main{flex:1;padding:1.5rem}.page-card{width:100%;max-width:48rem;margin:0 auto;border:1px solid var(--border);border-radius:1rem;background:var(--card);padding:1.5rem}.page-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem}h1{margin:0;font-size:1.125rem;line-height:1.75rem;font-weight:400;color:var(--foreground)}.muted{color:var(--muted-foreground)}

/* Compact Summary Stats Card */
.summary-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0.5rem; margin-bottom: 1.25rem; }
.summary-item { border: 1px solid var(--border); border-radius: 0.5rem; padding: 0.5rem 0.75rem; background: var(--card); display: flex; flex-direction: column; gap: 0.1rem; }
.summary-label { font-size: 0.65rem; color: var(--muted-foreground); font-weight: 500; text-transform: uppercase; letter-spacing: 0.025em; }
.summary-value { font-size: 1rem; font-weight: 600; color: var(--foreground); display: flex; align-items: center; gap: 0.35rem; }
.summary-badge { display: inline-flex; align-items: center; padding: 0.05rem 0.35rem; border-radius: 9999px; font-size: 0.65rem; font-weight: 600; }
.summary-badge.success { background: #dcfce7; color: #166534; border: 1px solid #bbf7d0; }
.summary-badge.warning { background: #fef3c7; color: #92400e; border: 1px solid #fde68a; }

.sections{display:flex;flex-direction:column;gap:1.5rem}.doc-section{border:1px solid var(--border);border-radius:.75rem;background:var(--card);padding:1.25rem}.section-header{display:flex;align-items:flex-start;justify-content:space-between;gap:1rem;margin-bottom:1rem}.section-title{margin:0;min-width:0;font-size:.875rem;line-height:1.25rem;font-weight:500;letter-spacing:.025em;color:var(--foreground)}
.icon-btn{display:inline-flex;flex-shrink:0;align-items:center;justify-content:center;border:1px solid color-mix(in oklch,var(--brand) 40%,transparent);border-radius:.5rem;background:transparent;padding:.5rem;color:var(--brand)}.icon-btn.danger{border-color:color-mix(in oklch,var(--danger) 50%,transparent);color:var(--danger)}.icon-btn:focus-visible,.upload-zone:focus-visible,.checkbox:focus-visible,.modal-btn:focus-visible{outline:2px solid var(--ring);outline-offset:2px}
.upload-zone{display:flex;width:100%;min-height:154px;flex-direction:column;align-items:center;justify-content:center;gap:.5rem;border:2px dashed color-mix(in oklch,var(--brand) 40%,transparent);border-radius:.75rem;background:var(--brand-soft);padding:2.5rem 1rem;color:var(--muted-foreground);font-size:.875rem;line-height:1.25rem}.upload-zone:hover{background:color-mix(in oklch,var(--brand-soft) 88%,var(--brand) 12%)}.upload-badge{display:inline-flex;align-items:center;justify-content:center;border-radius:9999px;background:var(--card);padding:.75rem;color:var(--brand);box-shadow:0 1px 2px rgb(0 0 0/.05)}.hidden{display:none}

.uploaded-card{display:flex;min-width:0;align-items:center;gap:1rem;border:1px solid var(--border);border-radius:.75rem;background:var(--card);padding:1rem;cursor:pointer;transition:background 120ms ease,border-color 120ms ease;}
.uploaded-card:hover{background:var(--background);border-color:color-mix(in oklch,var(--brand) 40%,transparent);}
.file-icon{flex:0 0 auto;color:var(--danger)}.file-name{min-width:0;flex:1;margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:1rem;color:var(--foreground)}.actions{display:flex;flex:0 0 auto;align-items:center}.action-pair{display:flex;align-items:center;gap:.5rem}

/* Checkbox States Container */
.status-checks{display:flex;flex-direction:column;gap:.5rem;margin-top:.75rem}
.signed-row{display:flex;align-items:center;justify-content:space-between;color:var(--foreground);font-size:.875rem;line-height:1.25rem}
.signed-label{display:flex;align-items:center;gap:0.75rem}
.status-date{font-size:.75rem;color:var(--muted-foreground);margin-left:.25rem}
.verifier-info{font-size:.75rem;color:var(--muted-foreground);font-style:italic;}

.checkbox{appearance:none;width:1rem;height:1rem;flex:0 0 1rem;margin:0;border:1px solid var(--border);border-radius:.25rem;background:var(--card);display:inline-flex;align-items:center;justify-content:center}.checkbox:checked{background:var(--brand);border-color:var(--brand)}.checkbox:checked:after{content:"";width:.28rem;height:.52rem;border:solid white;border-width:0 2px 2px 0;transform:translateY(-1px) rotate(45deg)}

/* Hover card pratinjau crop TTD */
.hover-wrap{position:relative;display:inline-flex}
.hover-card{position:absolute;z-index:30;right:0;bottom:calc(100% + .5rem);width:16rem;border:1px solid var(--border);border-radius:.5rem;background:var(--popover);color:var(--popover-foreground);padding:.75rem;box-shadow:0 10px 30px rgb(0 0 0/.1);opacity:0;visibility:hidden;transform:translateY(4px);transition:opacity 120ms ease,transform 120ms ease,visibility 120ms ease;pointer-events:none}
.hover-wrap:hover .hover-card,.hover-wrap.preview-open .hover-card{opacity:1;visibility:visible;transform:translateY(0);pointer-events:auto}
.hover-caption{margin:0 0 .5rem;font-size:.75rem;line-height:1rem;color:var(--muted-foreground)}
.cropped-preview-box{border:1px solid var(--border);border-radius:.375rem;background:#f8fafc;padding:.35rem;overflow:hidden;display:flex;align-items:center;justify-content:center;height:110px}
.cropped-preview-box img{max-width:100%;max-height:100%;object-fit:contain;display:block}

/* Modal Styling */
.dialog-backdrop{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;background:rgb(0 0 0/.8);padding:1rem}.dialog-backdrop.open{display:flex}.dialog{width:100%;max-width:36rem;max-height:calc(100vh - 2rem);overflow:auto;border:1px solid var(--border);border-radius:.75rem;background:var(--popover);color:var(--popover-foreground);padding:1.5rem;box-shadow:0 20px 50px rgb(0 0 0/.18)}.dialog.small{max-width:24rem}.dialog.large{max-width:56rem}.dialog-header{margin-bottom:1rem}.dialog-title{margin:0;font-size:1.125rem;font-weight:600}.dialog-description{margin:.25rem 0 0;font-size:.875rem;color:var(--muted-foreground)}.dialog-footer{display:flex;align-items:center;justify-content:flex-end;gap:.5rem;margin-top:1.5rem}
.modal-btn{display:inline-flex;align-items:center;justify-content:center;border-radius:.5rem;padding:.5rem 1rem;font-size:.875rem;border:1px solid var(--border);background:transparent;color:var(--foreground)}.modal-btn.primary{background:var(--brand);color:var(--brand-foreground);border-color:var(--brand)}.modal-btn.delete{border-color:var(--danger);background:var(--danger);color:var(--brand-foreground)}

/* Interactive Placement Area inside Modal */
.canvas-wrapper{position:relative;width:100%;height:480px;background:#e2e8f0;border:1px solid var(--border);border-radius:.5rem;overflow:auto;display:flex;justify-content:center;align-items:flex-start}
.doc-preview-canvas{position:relative;width:600px;min-height:800px;background:white;box-shadow:0 4px 12px rgb(0 0 0/.15);margin:1rem 0;overflow:hidden;display:flex;justify-content:center;align-items:flex-start}
.doc-preview-canvas canvas { width: 100%; height: auto; display: block; }
.doc-preview-canvas img { width: 100%; display: block; }

/* Multi-directional Drag & Resize Box */
.draggable-sig{position:absolute;width:90px;height:90px;border:2px dashed var(--brand);background:rgba(99,102,241,0.25);border-radius:.375rem;cursor:move;user-select:none;box-shadow:0 2px 6px rgb(0 0 0/.1)}
.handle{position:absolute;width:8px;height:8px;background:var(--brand);border-radius:50%}
.handle-n{top:-4px;left:calc(50% - 4px);cursor:ns-resize}
.handle-s{bottom:-4px;left:calc(50% - 4px);cursor:ns-resize}
.handle-e{right:-4px;top:calc(50% - 4px);cursor:ew-resize}
.handle-w{left:-4px;top:calc(50% - 4px);cursor:ew-resize}
.handle-nw{top:-4px;left:-4px;cursor:nwse-resize}
.handle-ne{top:-4px;right:-4px;cursor:nesw-resize}
.handle-sw{bottom:-4px;left:-4px;cursor:nesw-resize}
.handle-se{bottom:-4px;right:-4px;cursor:nwse-resize}

svg{display:block}@media(max-width:640px){main{padding:1rem}.page-card{padding:1rem}.doc-section{padding:1rem}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar" aria-label="Navigasi">
<span class="side-icon" aria-hidden="true" title="Menu Utama"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></span>
<span class="side-icon active" aria-hidden="true" title="Kelengkapan Dokumen"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v6h6"/><path d="M16 13H8"/><path d="M16 17H8"/><path d="M10 9H8"/></svg></span>
<span class="side-icon" aria-hidden="true" title="Pengaturan"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v6h6"/><path d="M12 18v-6"/><path d="M9 15h6"/></svg></span>
</aside>
<main>
<div class="page-card">
<div class="page-header"><h1>Kelengkapan Dokumen</h1><span class="muted" aria-hidden="true"></span></div>

<!-- Compact Summary Stats Card -->
<div class="summary-grid" id="summaryGrid"></div>

<div class="sections" id="sections"></div>
</div></main>
</div>

<input id="globalFileInput" class="hidden" type="file" accept=".pdf,image/*">

<!-- Modal Penandaan Posisi & Crop TTD -->
<div id="placementDialog" class="dialog-backdrop" role="presentation" aria-hidden="true">
<div class="dialog large" role="dialog" aria-modal="true">
<div class="dialog-header">
<h2 class="dialog-title" id="placementTitle">Tandai Posisi & Crop Tanda Tangan</h2>
<p class="dialog-description">Geser kotak atau tarik titik di sisi & sudutnya untuk mengatur area crop tanda tangan.</p>
</div>
<div class="canvas-wrapper" id="canvasWrapper">
  <div class="doc-preview-canvas" id="docPreviewCanvas">
    <div id="docContentArea"></div>
    <div id="draggableBox" class="draggable-sig" title="Area Crop Tanda Tangan">
      <div class="handle handle-n" data-dir="n"></div>
      <div class="handle handle-s" data-dir="s"></div>
      <div class="handle handle-e" data-dir="e"></div>
      <div class="handle handle-w" data-dir="w"></div>
      <div class="handle handle-nw" data-dir="nw"></div>
      <div class="handle handle-ne" data-dir="ne"></div>
      <div class="handle handle-sw" data-dir="sw"></div>
      <div class="handle handle-se" data-dir="se"></div>
    </div>
  </div>
</div>
<div class="dialog-footer">
<button type="button" class="modal-btn" onclick="cancelPlacement()" title="Batalkan pengaturan posisi">Batal</button>
<button type="button" class="modal-btn primary" id="confirmPlacementBtn" title="Simpan area crop terpilih">Konfirmasi & Simpan</button>
</div>
</div></div>

<!-- Modal Konfirmasi Hapus -->
<div id="confirmDialog" class="dialog-backdrop" role="presentation" aria-hidden="true">
<div class="dialog" role="dialog" aria-modal="true">
<div class="dialog-header"><h2 class="dialog-title">Yakin ingin menghapus?</h2><p class="dialog-description">Dokumen akan dihapus dan Anda bisa mengunggah ulang.</p></div>
<div class="dialog-footer"><button id="cancelDelete" type="button" class="modal-btn" title="Kembali tanpa menghapus">Batal</button><button id="confirmDelete" type="button" class="modal-btn delete" title="Hapus dokumen secara permanen">Hapus</button></div>
</div></div>

<script>
"use strict";
const FRU_TEXT = `FORM RESERVASI UNIT - PERORANGAN\nPT Citra Abadi Mandiri\nNO RESERVASI : CAMO/RSV/1222/000029\nDATA PEMESAN: APRIL YULIANTI\nUNIT DIPESAN: GA2-D17 SOHO AVENUE BADAN\nHARGA JUAL: Rp 6.000.000.000\n\nDipesan Oleh,\n\n\n( APRIL YULIANTI )`;

const FPU_TEXT = `FORM PEMESANAN UNIT - PERORANGAN
PT Citra Abadi Mandiri
FPU/0926/00004 | Tanggal: 04-09-2026 15:10:34
NO RESERVASI : CAMO/RSV/1222/000029
DATA PEMESAN: APRIL YULIANTI
ALAMAT: MEDITERANIA BOULEVARD FLORENCE 8 NO 62 PIK
UNIT DIPESAN: GA2-D17 SOHO AVENUE BADAN (Rp 6.000.000.000)

Dipesan Oleh,                        Diterima Oleh,
( ........................... )      ( ........................... )
      Konsumen                                Sales`;

const PS_TEXT = `PAYMENT SCHEDULE
Virtual Account: 67766031422000930 (BCA)
No. Reservasi: CAMO/RSV/1222/000029
Unit: SOHO GINZA AVENUE 2 BLOK D NO. 17
Nama: APRIL YULIANTI
No. Identitas: 3171024404820006

Rincian Pembayaran (Booking Fee & 36 Angsuran):
- GA2-D17/Invoice Booking Fee (29-Dec-22): Rp 150.000.000
- GA2-D17/Invoice Angsuran 1 s.d. 36 (Jan 23 - Dec 25): Rp 162.500.000 / bulan
Total Dibayar Konsumen: Rp 6.000.000.000

Disetujui Oleh,
Dibuat Oleh, | Penerima Pesanan, | Sales/Marketing Manager | Konsumen
(FAIRUZ AZKA AZHARI) | (IPENG WIDJOYO) | ( .................... ) | ( APRIL YULIANTI )`;

const fruBlobUrl = URL.createObjectURL(new Blob([FRU_TEXT], { type: 'application/pdf' }));
const fpuBlobUrl = URL.createObjectURL(new Blob([FPU_TEXT], { type: 'application/pdf' }));
const psBlobUrl = URL.createObjectURL(new Blob([PS_TEXT], { type: 'application/pdf' }));

const SECTIONS=[
{id:"fru",title:"FORM RESERVASI UNIT",signatures:1, canGenerate:true, fileName:"FRU_APRIL_YULIANTI_GA2_D17.pdf", fileUrl:fruBlobUrl},
{id:"fpu",title:"FORM PEMESANAN UNIT",signatures:2, canGenerate:true, fileName:"FPU_APRIL_YULIANTI__GA2_D17 (1).pdf", fileUrl:fpuBlobUrl},
{id:"ps",title:"PAYMENT SCHEDULE",signatures:4, canGenerate:true, fileName:"Payment_Schedule_APRIL_YULIANTI__GA2_D17.pdf", fileUrl:psBlobUrl}
];

const state=new Map();
let activeSectionId=null, deleteSectionId=null;
let pendingUploadFile = null;

const sectionsEl=document.getElementById("sections"), input=document.getElementById("globalFileInput");
const confirmDialog=document.getElementById("confirmDialog"), placementDialog=document.getElementById("placementDialog");

const ICONS={
filePlus:`<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v6h6"/><path d="M12 18v-6"/><path d="M9 15h6"/></svg>`,
upload:`<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>`,
fileText:`<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v6h6"/><path d="M16 13H8"/><path d="M16 17H8"/><path d="M10 9H8"/></svg>`,
eye:`<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></svg>`,
trash:`<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>`
};

function icon(name,size=18){return ICONS[name].replace('width="18" height="18"',`width="${size}" height="${size}"`)}
function esc(v){return String(v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}

function renderSummary(){
let signedCount = 0;
let checkedCount = 0;
let pendingCount = 0;

SECTIONS.forEach(s => {
    const f = state.get(s.id);
    if(f && f.signed) signedCount++;
    if(f && f.checked) checkedCount++;
    if(!f || !f.signed || !f.checked) pendingCount++;
});

const total = SECTIONS.length;
const summaryGrid = document.getElementById("summaryGrid");
summaryGrid.innerHTML = `
  <div class="summary-item">
    <span class="summary-label">Ditandatangani</span>
    <span class="summary-value">${signedCount}/${total} <span class="summary-badge ${signedCount === total ? 'success' : 'warning'}">${signedCount === total ? 'Lengkap' : 'Belum'}</span></span>
  </div>
  <div class="summary-item">
    <span class="summary-label">Diperiksa</span>
    <span class="summary-value">${checkedCount}/${total} <span class="summary-badge ${checkedCount === total ? 'success' : 'warning'}">${checkedCount === total ? 'Lengkap' : 'Belum'}</span></span>
  </div>
  <div class="summary-item">
    <span class="summary-label">Pending</span>
    <span class="summary-value" style="color: ${pendingCount > 0 ? 'var(--danger)' : 'var(--foreground)'};">${pendingCount} Dokumen</span>
  </div>
`;
}

function render(){
renderSummary();
sectionsEl.innerHTML=SECTIONS.map(s=>{
const f=state.get(s.id);
let topBtn = s.canGenerate ? `<button type="button" class="icon-btn" data-generate="${s.id}" title="Generate & Unduh Dokumen Template" aria-label="Generate & Unduh Dokumen Template">${icon("filePlus")}</button>` : "";

const content = f ? `
<div class="uploaded-card" data-upload="${s.id}" title="Klik untuk mengganti dokumen">
  <span class="file-icon" aria-hidden="true">${icon("fileText",24)}</span>
  <p class="file-name" title="${esc(f.name)}">${esc(f.name)}</p>
  <div class="actions" onclick="event.stopPropagation()">
    <div class="action-pair">
      <div class="hover-wrap">
        <a href="${f.url}" target="_blank" rel="noreferrer" class="icon-btn" title="Klik untuk buka dokumen, hover untuk preview TTD" aria-label="Buka Dokumen">${icon("eye")}</a>
        <div class="hover-card" role="tooltip">
          <p class="hover-caption">Preview Hasil Crop TTD</p>
          <div class="cropped-preview-box">
            <img src="${f.croppedUrl}" alt="Crop Tanda Tangan" loading="lazy">
          </div>
        </div>
      </div>
    </div>
    <button type="button" class="icon-btn danger" data-delete="${s.id}" title="Hapus Dokumen" aria-label="Hapus Dokumen" style="margin-left:0.5rem;">${icon("trash")}</button>
  </div>
</div>
<div class="status-checks">
  <div class="signed-row">
    <label class="signed-label" title="Centang jika dokumen telah ditandatangani secara fisik">
      <input class="checkbox" type="checkbox" data-signed="${s.id}" ${f.signed?"checked":""}>
      <span>Sudah ditandatangani</span>
    </label>
    <div>
      <span class="verifier-info">${f.signed && f.signedVerifier ? "Verifikator: " + esc(f.signedVerifier) + " | " : ""}</span>
      <span class="status-date">${f.signed && f.signedDate ? esc(f.signedDate) : ""}</span>
    </div>
  </div>
  <div class="signed-row">
    <label class="signed-label" title="Centang jika dokumen telah diperiksa kelengkapannya">
      <input class="checkbox" type="checkbox" data-checked="${s.id}" ${f.checked?"checked":""}>
      <span>Sudah diperiksa</span>
    </label>
    <div>
      <span class="verifier-info">${f.checked && f.checkedVerifier ? "Verifikator: " + esc(f.checkedVerifier) + " | " : ""}</span>
      <span class="status-date">${f.checked && f.checkedDate ? esc(f.checkedDate) : ""}</span>
    </div>
  </div>
</div>
` : `<button type="button" class="upload-zone" data-upload="${s.id}" title="Klik untuk unggah dokumen"><span class="upload-badge">${icon("upload",22)}</span><span>Klik untuk unggah dokumen</span></button>`;

return `<section class="doc-section"><div class="section-header"><h2 class="section-title">${esc(s.title)}</h2>${topBtn}</div>${content}</section>`;
}).join("");
bindEvents();
}

function bindEvents(){
document.querySelectorAll("[data-upload]").forEach(el=>el.addEventListener("click",(e)=>{
    activeSectionId=el.dataset.upload;
    input.value="";
    input.click();
}));

document.querySelectorAll("[data-generate]").forEach(el=>el.addEventListener("click",()=>{
    const secId = el.dataset.generate;
    const sec = SECTIONS.find(s => s.id === secId);
    if(sec && sec.fileUrl) {
        const a = document.createElement('a');
        a.href = sec.fileUrl;
        a.download = sec.fileName;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
    }
}));

document.querySelectorAll("[data-delete]").forEach(el=>el.addEventListener("click",()=>{deleteSectionId=el.dataset.delete;openDialog(confirmDialog)}));

document.querySelectorAll("[data-signed]").forEach(el=>el.addEventListener("change",(e)=>{
    const f=state.get(e.target.dataset.signed);
    if(f) {
        f.signed=e.target.checked;
        if(e.target.checked) {
            const now = new Date();
            const options = { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit', hour12: false };
            f.signedDate = now.toLocaleDateString('id-ID', options).replace(/\./g, ':');
            f.signedVerifier = "Aditya Putra";
        } else {
            f.signedDate = "";
            f.signedVerifier = "";
        }
        render();
    }
}));

document.querySelectorAll("[data-checked]").forEach(el=>el.addEventListener("change",(e)=>{
    const f=state.get(e.target.dataset.checked);
    if(f) {
        f.checked=e.target.checked;
        if(e.target.checked) {
            const now = new Date();
            const options = { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit', hour12: false };
            f.checkedDate = now.toLocaleDateString('id-ID', options).replace(/\./g, ':');
            f.checkedVerifier = "Aditya Putra";
        } else {
            f.checkedDate = "";
            f.checkedVerifier = "";
        }
        render();
    }
}));
}

input.addEventListener("change", async e => {
    const f = e.target.files && e.target.files[0];
    if(!f || !activeSectionId) return;
    const sec = SECTIONS.find(s => s.id === activeSectionId);
    const isPdf = f.type === "application/pdf" || f.name.toLowerCase().endsWith(".pdf");

    const reader = new FileReader();
    reader.onload = async function(evt) {
        const typedarray = new Uint8Array(evt.target.result);
        const blob = new Blob([typedarray], { type: f.type });
        const url = URL.createObjectURL(blob);

        pendingUploadFile = { id: activeSectionId, name: f.name, url, isPdf, rawData: typedarray };
        await openPlacementModal(sec ? sec.title : "Dokumen", typedarray, isPdf);
        activeSectionId = null;
    };
    reader.readAsArrayBuffer(f);
});

// Multi-directional Drag & Resize Logic
const draggableBox = document.getElementById("draggableBox");
const docPreviewCanvas = document.getElementById("docPreviewCanvas");

let currentX = 40, currentY = 670, currentW = 90, currentH = 90;
let isDragging = false, currentResizeDir = null;
let startX = 0, startY = 0, startLeft = 0, startTop = 0, startW = 0, startH = 0;

function updateBoxStyle(){
    draggableBox.style.left = currentX + "px";
    draggableBox.style.top = currentY + "px";
    draggableBox.style.width = currentW + "px";
    draggableBox.style.height = currentH + "px";
}

draggableBox.addEventListener("mousedown", (e) => {
    if(e.target.classList.contains("handle")) return;
    isDragging = true;
    startX = e.clientX;
    startY = e.clientY;
    startLeft = currentX;
    startTop = currentY;
    e.preventDefault();
});

document.querySelectorAll(".handle").forEach(handle => {
    handle.addEventListener("mousedown", (e) => {
        currentResizeDir = handle.dataset.dir;
        isDragging = false;
        startX = e.clientX;
        startY = e.clientY;
        startLeft = currentX;
        startTop = currentY;
        startW = currentW;
        startH = currentH;
        e.stopPropagation();
        e.preventDefault();
    });
});

document.addEventListener("mousemove", (e) => {
    const dx = e.clientX - startX;
    const dy = e.clientY - startY;

    if (isDragging) {
        currentX = startLeft + dx;
        currentY = startTop + dy;
        const maxW = docPreviewCanvas.clientWidth - currentW - 10;
        const maxH = docPreviewCanvas.clientHeight - currentH - 10;
        currentX = Math.max(5, Math.min(currentX, maxW));
        currentY = Math.max(5, Math.min(currentY, maxH));
        updateBoxStyle();
    } else if (currentResizeDir) {
        let newX = startLeft;
        let newY = startTop;
        let newW = startW;
        let newH = startH;

        if (currentResizeDir.includes("e")) newW = Math.max(40, startW + dx);
        if (currentResizeDir.includes("s")) newH = Math.max(40, startH + dy);
        if (currentResizeDir.includes("w")) {
            const potentialW = startW - dx;
            if (potentialW >= 40) { newW = potentialW; newX = startLeft + dx; }
        }
        if (currentResizeDir.includes("n")) {
            const potentialH = startH - dy;
            if (potentialH >= 40) { newH = potentialH; newY = startTop + dy; }
        }

        currentX = newX; currentY = newY; currentW = newW; currentH = newH;
        updateBoxStyle();
    }
});

document.addEventListener("mouseup", () => { isDragging = false; currentResizeDir = null; });

async function openPlacementModal(title, sourceData, isPdf){
    document.getElementById("placementTitle").textContent = `Tandai Posisi & Crop Tanda Tangan — ${title}`;
    const contentArea = document.getElementById("docContentArea");
    contentArea.innerHTML = "";

    if(isPdf){
        try {
            const loadingTask = pdfjsLib.getDocument({ data: sourceData });
            const pdfDoc = await loadingTask.promise;
            const page = await pdfDoc.getPage(1);
            const viewport = page.getViewport({ scale: 1.5 });

            const canvas = document.createElement("canvas");
            const context = canvas.getContext("2d");
            canvas.height = viewport.height;
            canvas.width = viewport.width;
            canvas.id = "sourcePdfCanvas";

            await page.render({ canvasContext: context, viewport: viewport }).promise;
            contentArea.appendChild(canvas);
        } catch(err) {
            contentArea.innerHTML = `<p style="padding:2rem;color:red;">Gagal merender halaman PDF.</p>`;
        }
    } else {
        const blob = new Blob([sourceData]);
        const imgUrl = URL.createObjectURL(blob);
        contentArea.innerHTML = `<img id="sourceImage" src="${imgUrl}" alt="Pratinjau Gambar">`;
    }

    currentX = 40; currentY = 670; currentW = 90; currentH = 90;
    updateBoxStyle();
    openDialog(placementDialog);
}

function generateCroppedImage(callback){
    const canvas = document.createElement("canvas");
    canvas.width = currentW;
    canvas.height = currentH;
    const ctx = canvas.getContext("2d");

    const imgEl = document.getElementById("sourceImage");
    const pdfCanvasEl = document.getElementById("sourcePdfCanvas");

    if (imgEl) {
        const scale = imgEl.naturalWidth / docPreviewCanvas.clientWidth;
        ctx.drawImage(imgEl, currentX * scale, currentY * scale, currentW * scale, currentH * scale, 0, 0, currentW, currentH);
        callback(canvas.toDataURL());
    } else if (pdfCanvasEl) {
        const scale = pdfCanvasEl.width / docPreviewCanvas.clientWidth;
        ctx.drawImage(pdfCanvasEl, currentX * scale, currentY * scale, currentW * scale, currentH * scale, 0, 0, currentW, currentH);
        callback(canvas.toDataURL());
    } else {
        callback("");
    }
}

document.getElementById("confirmPlacementBtn").addEventListener("click", () => {
    if(pendingUploadFile){
        generateCroppedImage((croppedUrl) => {
            state.set(pendingUploadFile.id, {
                name: pendingUploadFile.name,
                url: pendingUploadFile.url,
                isPdf: pendingUploadFile.isPdf,
                signed: false,
                signedDate: "",
                signedVerifier: "",
                checked: false,
                checkedDate: "",
                checkedVerifier: "",
                croppedUrl: croppedUrl
            });
            pendingUploadFile = null;
            closeDialog(placementDialog);
            render();
        });
    }
});

function cancelPlacement(){
    pendingUploadFile = null;
    closeDialog(placementDialog);
    render();
}

function openDialog(d){d.classList.add("open");d.setAttribute("aria-hidden","false")}
function closeDialog(d){d.classList.remove("open");d.setAttribute("aria-hidden","true")}

document.getElementById("cancelDelete").addEventListener("click",()=>{deleteSectionId=null;closeDialog(confirmDialog)});
document.getElementById("confirmDelete").addEventListener("click",()=>{if(deleteSectionId){state.delete(deleteSectionId)}deleteSectionId=null;closeDialog(confirmDialog);render()});

[confirmDialog, placementDialog].forEach(d=>d.addEventListener("click",e=>{if(e.target===d && d!==placementDialog)closeDialog(d)}));
document.addEventListener("keydown",e=>{if(e.key==="Escape"){closeDialog(confirmDialog);closeDialog(placementDialog)}});

render();
</script>
