<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Data Pemesan - Komposisi Pajak & Kepemilikan Unit</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f9fafb;color:#374151;font-family:Arial,Helvetica,sans-serif;font-size:14px}
button,input,select,textarea{font:inherit}button{cursor:pointer}
.wrap{max-width:1500px;margin:auto;padding:0 24px 90px 24px}
.stepper{height:72px;display:flex;align-items:center;justify-content:center;gap:16px}.step{display:flex;align-items:center;gap:8px;color:#9ca3af}.step.active{color:#2563eb;font-weight:600}.dot{width:16px;height:16px;border:3px solid #d1d5db;border-radius:50%;background:#fff}.active .dot{border-color:#2563eb}
.line{width:96px;height:1px;background:#d1d5db}

/* Layout Side-by-Side dengan minmax(0, 1fr) untuk mencegah dorongan horizontal */
.split-layout {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 440px;
    gap: 20px;
    align-items: start;
}
.form-pane {
    min-width: 0;
}
.preview-pane {
    position: sticky;
    top: 20px;
    display: flex;
    flex-direction: column;
}
.preview-header {
    height: 34px;
    padding-bottom: 6px;
    display: flex;
    align-items: center;
    font-size: 11px;
    font-weight: bold;
    text-transform: uppercase;
    color: #64748b;
    letter-spacing: 0.05em;
    transition: margin-top 0.15s ease;
}

/* Container Tab dengan Efek Gradient Fade di Kanan */
.tabs-wrapper {
    position: relative;
    max-width: 100%;
}
.tabs-wrapper::after {
    content: '';
    position: absolute;
    top: 0;
    right: 0;
    width: 48px;
    height: 34px;
    background: linear-gradient(to right, rgba(249, 250, 251, 0), #f9fafb);
    pointer-events: none;
    z-index: 2;
}

.tabs {
    display: flex;
    align-items: flex-end;
    gap: 4px;
    overflow-x: auto;
    max-width: 100%;
    white-space: nowrap;
    padding-bottom: 6px;
    user-select: none;
    cursor: grab;
}
.tabs:active {
    cursor: grabbing;
}
.tabs::-webkit-scrollbar { height: 5px; }
.tabs::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 3px; }
.tabs::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
.tabs::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

.tab{height:34px;padding:0 12px;font-size:12px;border:1px solid #e5e7eb;border-bottom:0;border-radius:6px 6px 0 0;background:#fff;color:#6b7280;text-transform:uppercase;flex:none}
.tab.active{background:#eff6ff;border-color:#dbeafe;color:#2563eb;font-weight:600}
.tab .x{margin-left:6px;color:#9ca3af}

.panel{background:#fff;border:1px solid #e5e7eb;border-radius:8px;overflow:hidden;margin-top:12px}
.panel-head{width:100%;display:flex;align-items:center;gap:16px;padding:16px 20px;border:0;text-align:left;background:#f9fafb;color:#1f2937}
.panel-head.closed{background:#fff}
.num{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#dbeafe;color:#2563eb;font-weight:600;font-size:12px;flex:none}
.panel-head.open .num{background:#2563eb;color:#fff}
.panel-title{flex:1;font-weight:600}
.body{padding:24px 20px}

input[type="checkbox"], input[type="radio"] { accent-color: #2563eb; }

/* Menghilangkan tombol panah (spinner) pada input number */
input[type=number]::-webkit-inner-spin-button, 
input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
input[type=number] { -moz-appearance: textfield; }

/* 4 Kolom dengan lebar pas dan aman dari tabrakan teks */
.grid-layout {
    display: grid;
    grid-template-columns: 1fr 140px 120px 110px;
    gap: 12px;
    align-items: center;
}

.grid-header {
    display: grid;
    grid-template-columns: 1fr 140px 120px 110px;
    gap: 12px;
    align-items: flex-start;
    font-size: 11px;
    font-weight: bold;
    color: #475569;
    text-transform: uppercase;
    margin-bottom: 12px;
    padding: 0 12px;
    letter-spacing: 0.05em;
}

.header-sub {
    font-size: 10px;
    font-weight: normal;
    color: #94a3b8;
    text-transform: none;
    margin-top: 4px;
    letter-spacing: normal;
    line-height: 1.3;
}

@keyframes softPulse {
    0% { background-color: #dbeafe; border-color: #3b82f6; }
    100% { background-color: #fff; border-color: #cbd5e1; }
}

.sort-item {
    padding: 12px;
    border: 1px solid #cbd5e1;
    background: #fff;
    border-radius: 6px;
    margin-bottom: 8px;
    will-change: transform;
    transition: border-color 0.2s, background-color 0.2s, box-shadow 0.2s;
}
.sort-item.just-moved { animation: softPulse 1s ease-out; }
.sort-item.dragging { opacity: 0.4; border: 2px dashed #2563eb; background: #eff6ff; }
.sort-item.drag-over { border-color: #2563eb; background: #f0f9ff; box-shadow: 0 4px 12px rgba(37,99,235,0.15); }
.sort-item[draggable="true"] { cursor: grab; }
.sort-item[draggable="true"]:active { cursor: grabbing; }
.sort-item[draggable="true"]:hover { border-color: #93c5fd; background: #f8fafc; box-shadow: 0 2px 4px rgba(37,99,235,0.04); }

.disabled-row {background: #f8fafc !important; color: #94a3b8; cursor: default;}
.disabled-row .sort-name {color: #94a3b8;}
.sort-name{font-weight:bold;text-transform:uppercase;color:#1e293b;display:flex;align-items:center;gap:8px}

.compact-check {display: flex; align-items: center; gap: 6px; font-size: 12px; cursor: pointer; white-space: nowrap; font-weight: 500;}

.percent{display:flex;width:100%;height:36px;border:1px solid #cbd5e1;border-radius:6px;overflow:hidden;background:#fff}
.percent input{width:100%;border:0;outline:0;padding:0 6px;font-weight:600;text-align:right}
.percent span{width:26px;display:flex;align-items:center;justify-content:center;border-left:1px solid #cbd5e1;color:#2563eb;font-weight:600;background:#f8fafc}

.sorter{background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;padding:14px}
.empty{text-align:center;color:#9ca3af;border:1px dashed #cbd5e1;padding:16px;border-radius:6px;background:#fff}

.form-panel{margin-top:12px}
.row{display:flex;flex-direction:column;gap:20px;margin-bottom:16px}
.row:last-child{margin-bottom:0}
.label{width:224px;flex:none;padding-top:8px;font-weight:500;color:#475569}
.inputs{display:grid;grid-template-columns:1fr 1fr;gap:20px;flex:1}
.input, .select, textarea{height:40px;width:100%;border:1px solid #cbd5e1;border-radius:6px;padding:0 12px;outline:0;background:#fff;color:#374151;text-transform:uppercase;}
.input:focus, .select:focus, textarea:focus{border-color:#2563eb;box-shadow:0 0 0 1px #2563eb}
.input:disabled, textarea:disabled, select:disabled { background: #f1f5f9; color: #64748b; cursor: not-allowed; }

.input::placeholder, textarea::placeholder { color: #C5C5C5; text-transform: none; }
textarea{height:80px;padding:10px 12px;resize:vertical}
.select{appearance:none;background-image:url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%236b7280' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");background-repeat:no-repeat;background-position:right 12px center;background-size:16px}
.select.unselected { color: #C5C5C5; }
.select option { color: #374151; }
.select option[value=""][disabled] { color: #C5C5C5; }

.phone-input{display:flex;border:1px solid #cbd5e1;border-radius:6px;overflow:hidden;background:#fff;height:40px;align-items:center}
.phone-input.disabled { background: #f1f5f9; }
.phone-prefix{display:flex;align-items:center;gap:6px;padding:0 12px;background:#f8fafc;border-right:1px solid #cbd5e1;font-size:13px;font-weight:600;color:#374151;height:100%}
.phone-prefix img{width:20px;height:14px;object-fit:cover;border-radius:2px}
.phone-input input{border:0;outline:0;height:100%;padding:0 12px;width:100%;color:#374151;text-transform:uppercase;background:transparent;}
.phone-input input::placeholder { color: #C5C5C5; text-transform: none; }
.copy-btn{background:transparent;border:0;padding:0 10px;color:#9ca3af;cursor:pointer;display:flex;align-items:center;height:100%}
.copy-btn:hover{color:#4b5563}

.radio-group{display:flex;gap:20px;align-items:center;height:40px}
.radio-label{display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;font-weight:500}

/* Custom Searchable Sales Dropdown (Fixed Position Overlay) */
.custom-dropdown { position: relative; width: 100%; }
.dropdown-trigger { height: 40px; width: 100%; border: 1px solid #cbd5e1; border-radius: 6px; padding: 0 12px; background: #fff; color: #374151; display: flex; align-items: center; justify-content: space-between; cursor: pointer; }
.dropdown-trigger.unselected { color: #C5C5C5; }
.dropdown-menu { position: fixed; background: #fff; border: 1px solid #cbd5e1; border-radius: 6px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.15); z-index: 9999; padding: 12px; }
.dropdown-search { width: 100%; height: 38px; border: 1px solid #cbd5e1; border-radius: 6px; padding: 0 12px 0 32px; outline: 0; margin-bottom: 8px; background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%239ca3af' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3ccircle cx='11' cy='11' r='8'></circle><line x1='21' y1='21' x2='16.65' y2='16.65'></line></svg>"); background-repeat: no-repeat; background-position: 10px center; background-size: 16px; }
.dropdown-list { max-height: 200px; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; }
.dropdown-item { padding: 10px 12px; border-radius: 4px; cursor: pointer; display: flex; flex-direction: column; gap: 2px; }
.dropdown-item:hover { background: #f1f5f9; }
.dropdown-item-name { font-weight: bold; font-size: 13px; color: #1e293b; }
.dropdown-item-sub { font-size: 11px; color: #64748b; }

.preview{background:#fff;border:1px solid #cbd5e1;padding:24px;box-shadow:0 4px 16px rgba(0,0,0,.06);border-radius:8px}
.preview hr{border:0;border-top:1px solid #111827;margin:16px 0}
.preview h4{font-size:13px;margin:0 0 8px}
.p-row{display:flex;gap:12px;font-size:13px}
.p-label{width:110px;flex:none}
.p-value{font-weight:600}

.bottom{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #e2e8f0;z-index:10;box-shadow:0 -4px 6px -1px rgba(0,0,0,0.05)}
.bottom-inner{max-width:1500px;margin:auto;padding:12px 24px;display:flex;justify-content:space-between;align-items:center}
.btn{border:1px solid #cbd5e1;border-radius:6px;padding:8px 18px;background:#fff;color:#374151;font-weight:600;transition:all 0.2s}
.btn:hover{background:#f8fafc}
.btn.primary{background:#2563eb;color:#fff;border-color:#2563eb}
.btn.primary:hover{background:#1d4ed8}
.actions{display:flex;gap:12px}

/* Toast Stack Container Styling (Pojok Bawah Kanan) */
@keyframes slideUpFade {
    from { transform: translateY(20px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
}
.toast-container {
    position: fixed;
    bottom: 24px;
    right: 24px;
    display: flex;
    flex-direction: column-reverse;
    gap: 10px;
    z-index: 9999;
    pointer-events: none;
}
.toast-notification {
    background: #ef4444;
    color: #fff;
    padding: 14px 20px;
    border-radius: 8px;
    box-shadow: 0 10px 25px -5px rgba(239, 68, 68, 0.3);
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 13px;
    font-weight: 500;
    max-width: 380px;
    pointer-events: auto;
    animation: slideUpFade 0.25s ease-out;
}

/* Modal Konfirmasi Hapus Styling */
.modal-overlay {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0, 0, 0, 0.45);
    display: flex; align-items: center; justify-content: center;
    z-index: 1000;
}
.modal-box {
    background: #fff; width: 440px; border-radius: 12px;
    box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
    padding: 32px 24px 24px 24px; position: relative; text-align: center;
}
.modal-close {
    position: absolute; top: 16px; right: 16px;
    background: transparent; border: 0; font-size: 18px; color: #9ca3af; cursor: pointer;
}
.modal-close:hover { color: #4b5563; }
.modal-icon-container {
    width: 140px; height: 140px; margin: 0 auto 16px auto;
    background: #f0fdf4; border-radius: 50%;
    display: flex; align-items: center; justify-content: center; position: relative;
}
.modal-text {
    font-size: 15px; font-weight: 500; color: #1f2937; margin-bottom: 24px; line-height: 1.5;
}
.modal-actions-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.btn-modal-cancel { background: #fff; border: 1px solid #d1d5db; color: #374151; padding: 10px; border-radius: 6px; font-weight: 600; cursor: pointer; }
.btn-modal-cancel:hover { background: #f9fafb; }
.btn-modal-danger { background: #ef4444; border: 1px solid #ef4444; color: #fff; padding: 10px; border-radius: 6px; font-weight: 600; cursor: pointer; }
.btn-modal-danger:hover { background: #dc2626; }

@media(max-width:1100px){.split-layout{grid-template-columns:1fr}.preview-pane{position:static}}
@media(min-width:768px){.section-row,.row{flex-direction:row}.label{width:224px}.inputs{grid-template-columns:1fr 1fr}}
@media(max-width:750px){.inputs{grid-template-columns:1fr}.line{width:40px}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const app=document.getElementById('app');
let pemesans=[makePemesan(1)];
let active=pemesans[0].id;
let order=[], representative=null, lastMovedId=null;
let deleteTargetId = null;
let toastMessages = [];
let toastTimer = null;

let genAcc = { 1: false, 2: false, 3: false };
let generalData = {
    salesName: 'AAN RIDUWAN',
    salesRole: 'REFERENTOR',
    salesEmail: 'AAN@EMAIL.COM',
    productInfo: 'BROSUR/FLYER',
    salesSearchQuery: '',
    salesDropdownOpen: false,
    dropdownCoords: { top: 0, left: 0, width: 0 },
    resvMode: 'tidak',
    resvFirst: '', resvLast: '', resvRelation: 'NONE',
    resvPhone1: '', resvPhone2: '', resvTel: '', resvEmail: '',
    resvAddrType: 'RUMAH', resvCountry: 'INDONESIA',
    resvProv: '', resvKota: '', resvKec: '', resvKel: '', resvPostal: '', resvAddress: ''
};

const salesList = [
    { name: "AAN RIDUWAN", role: "REFERENTOR", email: "AAN@EMAIL.COM" },
    { name: "AARON LINARTHA LAU (BLESS REALTY)", role: "AGENT", email: "AARON@EMAIL.COM" },
    { name: "AAT DAM ATI", role: "IN HOUSE", email: "AAT@EMAIL.COM" },
    { name: "ABDUL MUAZ PANE (PROPERTY PRO BANDUNG)", role: "IN HOUSE", email: "ABDUL@EMAIL.COM" }
];

let accordions = {};
function getAcc(pId) {
    if(!accordions[pId]) {
        accordions[pId] = {1: false, 2: false, 3: false, 4: false, 5: false};
    }
    return accordions[pId];
}

function makePemesan(n){
    return {
        id:'p-'+n+'-'+Math.random().toString(36).slice(2,7),
        firstName:'', lastName:'', phone:'', phoneOpt:'', phoneTel:'', email:'',
        addrType:'RUMAH', country:'INDONESIA', prov:'', kota:'', kec:'', kel:'', postal:'', address:'',
        idType:'NONE',
        job:'', sourceFund:'', income:'<25.000.000', paymentInst:'TUNAI', purpose:'', thirdParty:false,
        npwp:'', nitku:'', npwpName:'', npwpAddr:'',
        taxPercent:0, isOwner:false
    }
}

function name(p){return (p.firstName+' '+p.lastName).trim().toUpperCase()}
function ordered(){
    let ns = pemesans;
    let by = new Map(ns.map(p=>[p.id,p]));
    let seq = order.filter(id=>by.has(id));
    let rest = ns.filter(p=>!seq.includes(p.id)).map(p=>p.id);
    return [...seq,...rest].map(id=>by.get(id));
}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function joinNames(a){return a.length===0?'-':a.length===1?a[0]:a.slice(0,-1).join(', ')+' & '+a[a.length-1]}

function setupDragScroll() {
    const tabsContainer = document.querySelector('.tabs');
    if (!tabsContainer) return;
    let isDown = false, startX, scrollLeft;
    tabsContainer.addEventListener('mousedown', (e) => {
        isDown = true; tabsContainer.classList.add('active');
        startX = e.pageX - tabsContainer.offsetLeft; scrollLeft = tabsContainer.scrollLeft;
    });
    tabsContainer.addEventListener('mouseleave', () => { isDown = false; });
    tabsContainer.addEventListener('mouseup', () => { isDown = false; });
    tabsContainer.addEventListener('mousemove', (e) => {
        if(!isDown) return;
        e.preventDefault();
        const x = e.pageX - tabsContainer.offsetLeft;
        tabsContainer.scrollLeft = scrollLeft - (x - startX) * 1.5;
    });
}

document.addEventListener('input', function(e) {
    if (e.target && (e.target.matches('input[type="text"], textarea'))) {
        if (e.target.id === 'sales-search') {
            generalData.salesSearchQuery = e.target.value;
            render();
            setTimeout(() => {
                let el = document.getElementById('sales-search');
                if(el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
            }, 0);
            return;
        }
        let start = e.target.selectionStart;
        e.target.value = e.target.value.toUpperCase();
        e.target.setSelectionRange(start, start);
    }
});

document.addEventListener('click', function(e) {
    if(generalData.salesDropdownOpen && !e.target.closest('.custom-dropdown') && !e.target.closest('.dropdown-menu')) {
        generalData.salesDropdownOpen = false;
        generalData.salesSearchQuery = '';
        render();
    }
});

function showToasts(msgs) {
    toastMessages = msgs;
    render();
    if(toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(() => {
        toastMessages = [];
        render();
    }, 5000);
}

function handleNext() {
    let errors = [];
    let owners = pemesans.filter(p => p.isOwner);
    
    if (owners.length === 0) {
        errors.push("Harus ada minimal 1 Pemilik unit yang dicentang.");
    }
    if (!representative) {
        errors.push("Perwakilan FPU (Data Pemesan Utama) belum dipilih.");
    }
    let totalTax = pemesans.reduce((sum, p) => sum + (Number(p.taxPercent) || 0), 0);
    if (totalTax !== 100) {
        errors.push(`Total persentase pajak harus tepat 100% (saat ini ${totalTax}%).`);
    }

    if (errors.length > 0) {
        showToasts(errors);
        return;
    }

    alert("Validasi berhasil! Melanjutkan ke tahap berikutnya...");
}

function render(){
    if(generalData.resvMode !== 'tidak') {
        let pCheck = pemesans.find(x => x.id === generalData.resvMode);
        if(!pCheck || !name(pCheck)) {
            generalData.resvMode = 'tidak';
        }
    }

    let oldTabsScroll = 0;
    let existingTabs = document.querySelector('.tabs');
    if (existingTabs) { oldTabsScroll = existingTabs.scrollLeft; }

    const oldRects = new Map();
    document.querySelectorAll('.sort-item').forEach(el => {
        oldRects.set(el.dataset.id, el.getBoundingClientRect());
    });

    let activeId = document.activeElement ? document.activeElement.id : null;
    let selStart = null;
    if (activeId && document.activeElement.tagName === 'INPUT') {
        selStart = document.activeElement.selectionStart;
    }

    let tabs=pemesans.map((p,i)=>{
        let tabName = (i+1)+'. '+(name(p)||'PEMESAN '+(i+1));
        return `<button id="tab-btn-${p.id}" class="tab ${active===p.id?'active':''}" onclick="setActive('${p.id}')">${esc(tabName)}${i>0?`<span class="x" onclick="event.stopPropagation();promptRemove('${p.id}')">×</span>`:''}</button>`;
    }).join('');
    tabs+=`<button class="tab" onclick="addPemesan()">＋ PEMESAN</button><button class="tab ${active==='umum'?'active':''}" onclick="setActive('umum')">INFORMASI UMUM</button>`;

    let formContent = (active==='umum' ? general() : pemesanPanel(pemesans.find(p=>p.id===active)));
    
    let filteredSales = salesList.filter(s => s.name.includes(generalData.salesSearchQuery.toUpperCase()));
    let dropdownMenuHtml = generalData.salesDropdownOpen ? `
    <div class="dropdown-menu" style="top: ${generalData.dropdownCoords.top}px; left: ${generalData.dropdownCoords.left}px; width: ${generalData.dropdownCoords.width}px;">
        <input id="sales-search" class="dropdown-search" placeholder="Cari data..." value="${esc(generalData.salesSearchQuery)}">
        <div class="dropdown-list">
            ${filteredSales.length ? filteredSales.map(s => `
                <div class="dropdown-item" onclick="selectSales('${esc(s.name)}', '${esc(s.role)}', '${esc(s.email)}')">
                    <div class="dropdown-item-name">${esc(s.name)}</div>
                    <div class="dropdown-item-sub">${esc(s.role)} | ${esc(s.email)}</div>
                </div>
            `).join('') : '<div style="padding:8px;color:#9ca3af;text-align:center;font-size:12px">Tidak ada data ditemukan</div>'}
        </div>
    </div>` : '';

    let modalHtml = deleteTargetId ? `
    <div class="modal-overlay">
        <div class="modal-box">
            <button class="modal-close" onclick="closeModal()">✕</button>
            <div class="modal-icon-container">
                <svg width="80" height="80" viewBox="0 0 24 24" fill="none" stroke="#3b82f6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path>

function previewHtml(){
    let o=ordered().filter(p=>p.isOwner).map(name), t=ordered().filter(p=>p.taxPercent>0).map(name);
    return `<div class="preview"><h4>DATA PEMESAN</h4><div class="p-row"><span class="p-label">NAMA</span><span>:</span><span class="p-value">${esc(joinNames(o))}</span></div><hr><h4>DATA NPWP</h4><div class="p-row"><span class="p-label">NAMA NPWP</span><span>:</span><span class="p-value">${esc(joinNames(t))}</span></div></div>`;
}

function setActive(id){active=id;render()}
function addPemesan(){
    let n=makePemesan(pemesans.length+1);
    pemesans.push(n);
    active=n.id;
    render();
    setTimeout(() => {
        let tabsEl = document.querySelector('.tabs');
        if(tabsEl) { tabsEl.scrollLeft = tabsEl.scrollWidth; }
    }, 0);
}

function promptRemove(id){ deleteTargetId = id; render(); }
function closeModal(){ deleteTargetId = null; render(); }
function executeRemove(){
    if(!deleteTargetId) return;
    let id = deleteTargetId;
    pemesans=pemesans.filter(p=>p.id!==id);
    order=order.filter(x=>x!==id);
    if(representative===id)representative=null;
    if(active===id)active=pemesans[0]?pemesans[0].id:'umum';
    deleteTargetId = null;
    render();
}

function updateField(id,k,v){ let p=pemesans.find(x=>x.id===id); if(p){p[k]=v;} }

function updateName(id, k, v){
    let p=pemesans.find(x=>x.id===id);
    if(p){
        p[k]=v;
        let tabEl = document.getElementById('tab-btn-' + id);
        if(tabEl){
            let currentIdx = pemesans.findIndex(x => x.id === id);
            let tabName = (currentIdx + 1) + '. ' + (name(p) || ('PEMESAN ' + (currentIdx + 1)));
            let closeBtn = currentIdx > 0 ? `<span class="x" onclick="event.stopPropagation();promptRemove('${id}')">×</span>` : '';
            tabEl.innerHTML = esc(tabName) + closeBtn;
        }
    }
}

function tax(id,v){let p=pemesans.find(x=>x.id===id);if(p)p.taxPercent=Math.max(0,Math.min(100,Number(v)||0));render()}

function toggleAcc(pId, secNum){
    let acc = getAcc(pId);
    let willOpen = !acc[secNum];
    Object.keys(acc).forEach(k => acc[k] = false);
    acc[secNum] = willOpen;
    render();
}

function owner(id, v){
    let p = pemesans.find(x => x.id === id);
    if(p){
        let wasOwner = p.isOwner;
        p.isOwner = v;
        lastMovedId = id;
        setTimeout(() => { if(lastMovedId === id) lastMovedId = null; }, 1000);

        if(!v && representative === id) { representative = null; }

        if(v && !wasOwner) {
            order = order.filter(x => x !== id);
            order.push(id);
        } else if(!v) {
            order = order.filter(x => x !== id);
        }

        let owners = pemesans.filter(item => item.isOwner);
        let nonOwners = pemesans.filter(item => !item.isOwner);
        let byId = new Map(pemesans.map(item => [item.id, item]));
        
        let seq = order.filter(oid => byId.has(oid) && byId.get(oid).isOwner);
        let rest = owners.filter(item => !seq.includes(item.id)).map(item => item.id);
        order = [...seq, ...rest];

        pemesans = [...order.map(oid => byId.get(oid)), ...pemesans.filter(item => !item.isOwner && !order.includes(item.id))];
    }
    render();
}

function rep(id){representative=id;render()}

let dragId=null;
function onDragStart(e, id) { dragId = id; e.currentTarget.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move'; }
function onDragEnd(e) {
    e.currentTarget.classList.remove('dragging');
    document.querySelectorAll('.sort-item').forEach(el => el.classList.remove('drag-over'));
    dragId = null;
}
function onDragEnter(e, id) { e.preventDefault(); if (e.currentTarget.dataset.id !== dragId) { e.currentTarget.classList.add('drag-over'); } }
function onDragLeave(e) { e.currentTarget.classList.remove('drag-over'); }
function drop(e, to){
    e.preventDefault();
    document.querySelectorAll('.sort-item').forEach(el => el.classList.remove('drag-over'));
    if(!dragId || dragId===to) return;
    let owners = pemesans.filter(p => p.isOwner);
    let nonOwners = pemesans.filter(p => !p.isOwner);
    let ownerIds = owners.map(p => p.id);
    let a = ownerIds.indexOf(dragId), b = ownerIds.indexOf(to);
    if(a < 0 || b < 0) return;
    ownerIds.splice(b, 0, ownerIds.splice(a, 1)[0]);
    let ownerMap = new Map(owners.map(p => [p.id, p]));
    pemesans = [...ownerIds.map(id => ownerMap.get(id)), ...nonOwners];
    order = ownerIds;
    dragId = null;
    render();
}

render();
</script>
